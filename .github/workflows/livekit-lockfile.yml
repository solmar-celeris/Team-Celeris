name: Generate and validate LiveKit lockfile

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/livekit-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile-and-build:
    if: github.event.head_commit.message != 'chore: refresh LiveKit lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version
      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh LiveKit lockfile"
            git push
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
